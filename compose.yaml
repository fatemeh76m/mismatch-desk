services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mismatch_desk
      POSTGRES_USER: mismatch_desk
      POSTGRES_PASSWORD: mismatch_desk_dev
    ports:
      - "5432:5432"
    volumes:
      - mismatch_desk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mismatch_desk -d mismatch_desk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mismatch_desk_postgres:
